<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DWG Intelligence UI Overview</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 28px; background: #eef2f5; color: #122b38; font-family: Arial, sans-serif; }
      h1 { margin: 0 0 8px; font-size: 28px; }
      p { margin: 0 0 22px; color: #61717c; }
      main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
      figure { margin: 0; overflow: hidden; border: 1px solid #cbd5dc; border-radius: 10px; background: white; box-shadow: 0 5px 18px rgba(22, 42, 54, .08); }
      figcaption { padding: 11px 14px; border-bottom: 1px solid #dbe2e7; font-size: 15px; font-weight: 700; }
      img { display: block; width: 100%; height: auto; }
    </style>
  </head>
  <body>
    <h1>DWG Intelligence · UI Capture Overview</h1>
    <p>실제 URL 라우트는 단일 SPA 경로 / 하나이며, 아래는 핵심 화면 상태입니다.</p>
    <main>
      <figure><figcaption>01 · Workspace loaded</figcaption><img src="01-workspace-loaded.png" /></figure>
      <figure><figcaption>02 · Inspection complete</figcaption><img src="02-inspection-complete.png" /></figure>
      <figure><figcaption>03 · Layer hidden</figcaption><img src="03-layer-hidden.png" /></figure>
      <figure><figcaption>04 · Claude selected</figcaption><img src="04-claude-selected.png" /></figure>
      <figure><figcaption>05 · Dark theme</figcaption><img src="05-dark-theme.png" /></figure>
    </main>
  </body>
</html>
